api: Car-Cutter API
base_url: https://api.car-cutter.com
authentication:
  style: http-bearer
  header: 'Authorization: Bearer <token>'
  scheme_name: api_key
  applied: globally (root-level security)
  exception: 'POST /vehicle/composition/segment is a keyless public demo path documented in
