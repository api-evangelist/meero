  see: authentication/meero-authentication.yml
media_types:
  requests: multipart/form-data (all POST operations)
  responses: [application/json, image/jpeg, 'plain/text (base64 image string)']
  note: 'The synchronous composition response is declared as media type "plain/text", which is not
    a valid IANA media type (the correct token is text/plain). A strict client content-negotiating
    on the contract will not match the response.'
idempotency:
  header: null
  mechanism: client-supplied-natural-key-upsert
  detail: 'There is no Idempotency-Key header and no idempotency documentation. POST
    /vehicle/submission is nonetheless an upsert keyed on the caller-supplied vehicle_id — the
    contract states "If a vehicle with that id already exists, it is updated and its status is set
    to new" — so a retried vehicle write does not create a duplicate. Image submissions
    (asyncSubmit, syncSubmit) have NO such key: a retried image POST is billed and processed again.'
  safe_to_retry:
  - POST /vehicle/submission (upsert on vehicle_id)
  unsafe_to_retry:
  - POST /vehicle/composition/single-segment (syncSubmit) — re-processes and re-charges credits
  - POST /vehicle/image/submission (asyncSubmit) — re-processes and re-charges credits
  - POST /vehicle/feature/submission (featureSubmit)
  pointer_note: 'No `Idempotency` pointer is emitted in apis.yml. An upsert on one of four write
    operations is not an API-wide idempotency mechanism, and claiming one would credit CarCutter
    with a guarantee it does not make.'
pagination:
  supported: false
  detail: 'POST /vehicle/list and GET /vehicle/shotlist return collections with no limit, offset,
    cursor or page parameter and no envelope metadata. Collection size is unbounded in the contract.'
filtering:
  detail: Query-parameter filtering is per-operation only (vehicle_id, image identifiers); no generic filter syntax.
expansion:
  supported: false
metadata:
  field: custom_reference
  detail: Vehicle records carry a single free-text custom_reference field for caller-side correlation; there is no key/value metadata map.
request_tracing:
  request_id_header: null
  observed_headers: 'Responses carry only nginx/CloudFront infrastructure headers (x-amz-cf-id, via, x-cache). No application request id is returned.'
versioning:
  see: lifecycle/meero-lifecycle.yml
  in_url: false
