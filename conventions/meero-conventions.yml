async_pattern:
  style: submit-then-poll
  submit: POST /vehicle/image/submission (asyncSubmit)
  poll: GET /vehicle/image/status (asyncStatus)
  fetch: GET /vehicle/image/result (asyncResult)
  terminal_states: [final, error, expired]
  phases: [unknown, downloading, analyzing, cutting, qa-ing, retouching, ready]
  callbacks: 'None. No webhook, callback URL or event stream is offered — polling is the only completion signal.'
  forward_compatibility: 'The contract explicitly warns that more status, phase and quality enum values may be added; clients must tolerate unknown values.'
dry_run_mode:
  supported: false
  detail: 'No dry-run/preview flag exists. The closest surface is the keyless demo path
    (/vehicle/composition/segment) plus cut_type "none", which returns an empty JSON body rather
    than a rendered image — usable for shape rehearsal but not documented as a dry run.'
reversibility:
  grade: absent
  write_surface: true
  detail: 'The API has four write operations and no documented reversal operation, no undo, and no
    stated window for any of them. An agent cannot learn from the contract whether an action it is
    about to take can be taken back.'
  operations:
  - operation: POST /vehicle/submission
    consequence: Creates or overwrites a vehicle record and resets its status to "new".
    reversal: none documented
    window: null
  - operation: DELETE /vehicle/delete
    consequence: Marks a vehicle deleted (the contract states vehicle status can be new, active or deleted).
    reversal: none documented
    window: null
    note: 'Because the record persists in a "deleted" state and /vehicle/submission upserts on
      vehicle_id, re-submitting the same id would plausibly restore it — but the docs do not say
      so, so this is recorded as an inference and NOT as a documented reversal.'
  - operation: DELETE /vehicle/feature/delete
    consequence: Removes one feature (hotspot) annotation from a vehicle.
    reversal: 'Re-create via POST /vehicle/feature/submission (featureSubmit) — a re-create, not a documented undo; prior annotation content is not recoverable from the API.'
    window: null
  - operation: DELETE /vehicle/features/delete
    consequence: Removes ALL feature annotations for a vehicle in one call.
    reversal: 'Re-create via featureSubmit only; no bulk restore. This is the highest-consequence unguarded call in the contract — it takes a single vehicle_id and has no confirmation parameter.'
    window: null
  - operation: POST /vehicle/image/submission
    consequence: Enqueues billable image processing (402 Credits exceeded when the account balance is out).
    reversal: 'none — no cancel operation exists for a queued or in-flight execution.'
    window: null
  expiry_not_reversal: 'GET /vehicle/image/result returns 410 "file does not exist anymore." after a
    result expires. That is a retention limit, not a reversal, and the window is not published.'
