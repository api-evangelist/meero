aid: meero
name: Meero
description: 'Meero is the Paris-founded AI visual-content company that rebranded to Diffusely
  in December 2024 after pivoting away from on-demand photography marketplaces toward vertical
  AI imaging software. Its surviving operating brand is CarCutter (DIFFUSELY Austria GmbH, whose
  API host still returns the copyright line "(c) 2026 Meero Austria GmbH"), a B2B vehicle
  merchandising platform used by dealership groups, OEMs and used-vehicle marketplaces for guided
  capture, AI backgrounding, 360 spins, feature hotspots and automated publishing. The public
  developer surface is the Car-Cutter API (OpenAPI 3.1, bearer token, api.car-cutter.com), a
  keyless public demo endpoint, an OAuth-gated remote MCP server, a WebPlayer web-component
  family on npm, and a Statuspage. Two former Diffusely verticals have since left the group:
  autoRetouch merged into Grand Shooting (February 2026) and ProperShot joined Nodalview, so
  neither of their APIs is attributed here.'
