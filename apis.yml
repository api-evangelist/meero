apis:
- aid: meero:carcutter-api
  name: Car-Cutter API
  description: 'The Car-Cutter API is the public REST contract for CarCutter vehicle image
    processing. It covers vehicle inventory records and shot lists, synchronous single-image
    composition, asynchronous batch image submission with status polling and result retrieval,
    and the Feature (hotspot) API for annotating vehicle equipment and damage. Authentication is
    an HTTP bearer token; the composition endpoint also exposes a keyless public demo mode.'
