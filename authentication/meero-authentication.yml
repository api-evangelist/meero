docs: https://cloud.car-cutter.com/doc/api.html
summary:
  types:
  - http
  - oauth2
  - openIdConnect
  note: 'Three distinct authentication surfaces, only one of which is the public product API.'
schemes:
- name: api_key
  type: http
  scheme: bearer
  surface: public REST API (https://api.car-cutter.com)
  applied: root-level security on every operation
  sources:
  - openapi/meero-carcutter-openapi.json
  detail: 'The scheme is named "api_key" but declared as HTTP bearer. Tokens are issued per
    CarCutter account; there are no scopes, no token endpoint and no documented rotation or
    expiry policy. The 401 message the contract publishes is "submitted ''Bearer'' token is
    unauthorized".'
  observed:
    request: GET https://api.car-cutter.com/vehicle/status?vehicle_id=test (no Authorization header)
    http_status: 401
    body_content_type: text/html
    note: 'The live 401 body is an HTML "401 Unauthorized" page, not the JSON UnauthorizedResponse
      the contract documents — a real gap between contract and runtime.'
- name: none (public demo)
  type: none
  surface: POST https://api.car-cutter.com/vehicle/composition/segment
  detail: 'A keyless demo composition path documented in github.com/carcutter/carcutter-api-samples.
    Probed unauthenticated on 2026-08-25 and returned 400 "invalid file" rather than 401,
    confirming it requires no credential. See sandbox/meero-sandbox.yml.'
- name: carcutter_mcp_oauth
  type: oauth2
  surface: https://www.carcutter.com/wp-json/mcp/mcp-oauth-server
  flows:
    authorizationCode:
